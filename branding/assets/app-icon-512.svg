<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Space background -->
  <rect width="512" height="512" rx="64" fill="#0D121D" />
  <!-- Clock wheel outer disk -->
  <circle cx="256" cy="256" r="205" fill="#151E2E" stroke="#78909C" stroke-width="8" />
  <!-- Day sky arc -->
  <path d="M 256 256 L 51 256 A 205 205 0 0 1 461 256 Z" fill="#D8E8F8" />
  <!-- Golden hour morning & evening -->
  <path d="M 256 256 L 51 256 A 205 205 0 0 1 92 138 Z" fill="#FFA726" />
  <path d="M 256 256 L 420 138 A 205 205 0 0 1 461 256 Z" fill="#FFA726" />
  <!-- Solar noon apex -->
  <path d="M 256 256 L 230 54 A 205 205 0 0 1 282 54 Z" fill="#FFFFFF" />
  <!-- Center 3D Earth Globe -->
  <circle cx="256" cy="256" r="56" fill="#1976D2" stroke="#64B5F6" stroke-width="4" />
  <path d="M 243 220 Q 276 210 286 240 Q 271 276 235 266 Q 220 240 243 220 Z" fill="#388E3C" />
  <!-- Center observer pin -->
  <circle cx="256" cy="256" r="8" fill="#FFD54F" />
  <!-- Clock hand -->
  <line x1="256" y1="256" x2="256" y2="82" stroke="#EF5350" stroke-width="9" stroke-linecap="round" />
</svg>
