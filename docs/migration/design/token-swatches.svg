<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title">
  <title id="title">AstroAlarm design tokens — exact hex from design-tokens.json</title>
  <rect width="960" height="640" fill="#12121f"/>
  <text x="32" y="40" fill="#E6E6F0" font-family="system-ui,sans-serif" font-size="22">AstroAlarm tokens</text>
  <text x="32" y="64" fill="#8E8EA0" font-family="system-ui,sans-serif" font-size="13">Source: design-tokens/design-tokens.json — not Material You dynamic color</text>
  <g font-family="ui-monospace,monospace" font-size="11">
    <!-- light row -->
    <text x="32" y="100" fill="#C4C4D4" font-family="system-ui,sans-serif" font-size="14">Light</text>
    <rect x="32" y="112" width="88" height="56" fill="#B3263E"/><text x="36" y="184" fill="#E6E6F0">#B3263E primary</text>
    <rect x="128" y="112" width="88" height="56" fill="#FFFFFF" stroke="#8E8EA0"/><text x="132" y="184" fill="#E6E6F0">#FFFFFF bg</text>
    <rect x="224" y="112" width="88" height="56" fill="#F5F5FA"/><text x="228" y="184" fill="#E6E6F0">#F5F5FA surface</text>
    <rect x="320" y="112" width="88" height="56" fill="#E2E2EC"/><text x="324" y="184" fill="#E6E6F0">#E2E2EC variant</text>
    <rect x="416" y="112" width="88" height="56" fill="#4A5F82"/><text x="420" y="184" fill="#E6E6F0">#4A5F82 secondary</text>
    <rect x="512" y="112" width="88" height="56" fill="#6B5778"/><text x="516" y="184" fill="#E6E6F0">#6B5778 tertiary</text>
    <rect x="608" y="112" width="88" height="56" fill="#BA1A1A"/><text x="612" y="184" fill="#E6E6F0">#BA1A1A error</text>
    <rect x="704" y="112" width="88" height="56" fill="#1a1a2e"/><text x="708" y="184" fill="#E6E6F0">#1a1a2e canvas</text>
    <rect x="800" y="112" width="88" height="56" fill="#C9A227"/><text x="804" y="184" fill="#E6E6F0">#C9A227 gold</text>
    <!-- dark row -->
    <text x="32" y="228" fill="#C4C4D4" font-family="system-ui,sans-serif" font-size="14">Dark (app chrome default when system is dark; lockscreen forced)</text>
    <rect x="32" y="240" width="88" height="56" fill="#D3304E"/><text x="36" y="312" fill="#E6E6F0">#D3304E primary</text>
    <rect x="128" y="240" width="88" height="56" fill="#12121f"/><text x="132" y="312" fill="#E6E6F0">#12121f bg</text>
    <rect x="224" y="240" width="88" height="56" fill="#1a1a2e"/><text x="228" y="312" fill="#E6E6F0">#1a1a2e surface</text>
    <rect x="320" y="240" width="88" height="56" fill="#2a2a42"/><text x="324" y="312" fill="#E6E6F0">#2a2a42 variant</text>
    <rect x="416" y="240" width="88" height="56" fill="#9BB8E8"/><text x="420" y="312" fill="#E6E6F0">#9BB8E8 secondary</text>
    <rect x="512" y="240" width="88" height="56" fill="#D4BEE8"/><text x="516" y="312" fill="#E6E6F0">#D4BEE8 tertiary</text>
    <rect x="608" y="240" width="88" height="56" fill="#FFB4AB"/><text x="612" y="312" fill="#E6E6F0">#FFB4AB error</text>
    <rect x="704" y="240" width="88" height="56" fill="#1a1a2e"/><text x="708" y="312" fill="#E6E6F0">canvas night</text>
    <rect x="800" y="240" width="88" height="56" fill="#C9A227"/><text x="804" y="312" fill="#E6E6F0">canvas gold</text>
    <!-- widget list extras (hardcoded, not tokens) -->
    <text x="32" y="356" fill="#C4C4D4" font-family="system-ui,sans-serif" font-size="14">Upcoming / natal-align widget (hardcoded XML, not tokens)</text>
    <rect x="32" y="368" width="88" height="56" fill="#121824"/><text x="36" y="440" fill="#E6E6F0">#121824 @ 90%</text>
    <rect x="128" y="368" width="88" height="56" fill="#FFD54F"/><text x="132" y="440" fill="#E6E6F0">#FFD54F title</text>
    <rect x="224" y="368" width="88" height="56" fill="#FFFFFF"/><text x="228" y="440" fill="#E6E6F0">#FFFFFF line1</text>
    <rect x="320" y="368" width="88" height="56" fill="#E0E0E0"/><text x="324" y="440" fill="#E6E6F0">#E0E0E0 line2</text>
    <rect x="416" y="368" width="88" height="56" fill="#CFD8DC"/><text x="420" y="440" fill="#E6E6F0">#CFD8DC line3</text>
    <rect x="512" y="368" width="88" height="56" fill="#90A4AE"/><text x="516" y="440" fill="#E6E6F0">#90A4AE empty</text>
    <rect x="608" y="368" width="88" height="56" fill="#B0BEC5"/><text x="612" y="440" fill="#E6E6F0">#B0BEC5 count</text>
    <!-- spacing -->
    <text x="32" y="484" fill="#C4C4D4" font-family="system-ui,sans-serif" font-size="14">Spacing 4 / 8 / 16 / 24 / 32 dp · Radius 4 / 8 / 16 dp · Elevation 0 / 1 / 3 dp</text>
    <rect x="32" y="500" width="4" height="32" fill="#C9A227"/>
    <rect x="48" y="500" width="8" height="32" fill="#C9A227"/>
    <rect x="68" y="500" width="16" height="32" fill="#C9A227"/>
    <rect x="96" y="500" width="24" height="32" fill="#C9A227"/>
    <rect x="132" y="500" width="32" height="32" fill="#C9A227"/>
    <rect x="200" y="508" width="48" height="24" rx="4" fill="#2a2a42" stroke="#8E8EA0"/>
    <rect x="260" y="508" width="48" height="24" rx="8" fill="#2a2a42" stroke="#8E8EA0"/>
    <rect x="320" y="508" width="48" height="24" rx="16" fill="#2a2a42" stroke="#8E8EA0"/>
    <text x="32" y="560" fill="#8E8EA0" font-family="system-ui,sans-serif" font-size="12">Typography: system sans. titleLarge 22/27.9/400 · headlineMedium 28/33.6/400 · bodyLarge 16/24/400 · bodyMedium 14/20/400 · labelLarge 14/20/500</text>
    <text x="32" y="584" fill="#8E8EA0" font-family="system-ui,sans-serif" font-size="12">Lockscreen extras (not in token file): time 64sp Bold · label 24sp Medium primary · Stop/Snooze 18sp on 56dp × 16dp-radius buttons</text>
    <text x="32" y="616" fill="#8E8EA0" font-family="system-ui,sans-serif" font-size="12">No dynamicColorScheme. Canvas night/gold identical in light and dark.</text>
  </g>
</svg>
